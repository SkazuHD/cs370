services:
  mongo:
    image: mongo:latest
    container_name: "mongodb_app"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "passwod"
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    networks:
      - local
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: "qdrant"
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - local
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:

networks:
  local:
    name: eng-ai-agents-net
    external: true
